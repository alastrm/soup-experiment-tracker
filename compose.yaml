name: soup-task
services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: soup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soup_local_only}
      POSTGRES_DB: soup
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db-init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soup -d soup"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://soup:${POSTGRES_PASSWORD:-soup_local_only}@db:5432/soup
      TEST_DATABASE_URL: postgresql+asyncpg://soup:${POSTGRES_PASSWORD:-soup_local_only}@db:5432/soup_test
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
